<rect x="20.0" y="70" width="4" height="46" rx="2" fill="#22d3ee"/>
<text x="38.0" y="99" fill="#22d3ee" font-weight="700">L0</text>
<text x="80.0" y="99" fill="#eafff3" font-weight="700" letter-spacing="2">EDGE</text>
<text x="190.0" y="99" fill="#c9d6cf" style="font-size:13px">HTTPS everywhere, security headers, rate limits on public routes</text>
<text x="866.0" y="99" text-anchor="end" fill="#39ff88" style="font-size:12px" class="st">■ ARMED</text>
</g><g class="ly" style="animation-delay:0.45s">
