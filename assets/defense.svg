<svg xmlns="http://www.w3.org/2000/svg" width="900" height="456" viewBox="0 0 900 456">
<style>
text{ font-family:'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px }
.ly{opacity:0;animation:up .5s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.st{animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.3}}
.core{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
</style>
<rect x=".5" y=".5" width="899" height="455" rx="12" fill="#07090b" stroke="#39ff88" stroke-opacity=".35"/>
<text x="24" y="38" fill="#5b6b62" letter-spacing="3" style="font-size:12px">// DEFENSE IN DEPTH . HOW EVERY KAGU PRODUCT GETS LOCKED DOWN</text>
