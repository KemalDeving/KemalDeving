<rect x="64.0" y="294" width="4" height="46" rx="2" fill="#ff2e88"/>
<text x="82.0" y="323" fill="#ff2e88" font-weight="700">L4</text>
<text x="124.0" y="323" fill="#eafff3" font-weight="700" letter-spacing="2">SECRETS</text>
<text x="234.0" y="323" fill="#c9d6cf" style="font-size:13px">service keys stay server-side, no secrets in git</text>
<text x="822.0" y="323" text-anchor="end" fill="#39ff88" style="font-size:12px" class="st">■ ARMED</text>
