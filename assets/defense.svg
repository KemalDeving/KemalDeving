<text x="811.0" y="379" text-anchor="end" fill="#39ff88" style="font-size:12px" class="st">■ ARMED</text>
</g>
<text x="450" y="432" text-anchor="middle" class="core" fill="#39ff88" letter-spacing="4" style="font-size:13px">[ CORE: YOUR USERS' DATA ]</text>
</svg>