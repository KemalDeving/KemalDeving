<text x="49.0" y="155" fill="#39ff88" font-weight="700">L1</text>
<text x="91.0" y="155" fill="#eafff3" font-weight="700" letter-spacing="2">IDENTITY</text>
<text x="201.0" y="155" fill="#c9d6cf" style="font-size:13px">Supabase Auth, public signups off where not needed</text>
<text x="855.0" y="155" text-anchor="end" fill="#39ff88" style="font-size:12px" class="st">■ ARMED</text>
</g><g class="ly" style="animation-delay:0.70s">
<rect x="42.0" y="182" width="816" height="46" rx="6" fill="#0c1310" stroke="#39ff88" stroke-opacity=".55"/>
<rect x="42.0" y="182" width="4" height="46" rx="2" fill="#39ff88"/>
<text x="60.0" y="211" fill="#39ff88" font-weight="700">L2</text>
<text x="102.0" y="211" fill="#eafff3" font-weight="700" letter-spacing="2">ACCESS</text>
<text x="212.0" y="211" fill="#c9d6cf" style="font-size:13px">role checks on the server, never only hidden in the UI</text>
<text x="844.0" y="211" text-anchor="end" fill="#39ff88" style="font-size:12px" class="st">■ ARMED</text>
</g><g class="ly" style="animation-delay:0.95s">
<rect x="53.0" y="238" width="794" height="46" rx="6" fill="#0c1310" stroke="#39ff88" stroke-opacity=".55"/>
<rect x="53.0" y="238" width="4" height="46" rx="2" fill="#39ff88"/>
<text x="71.0" y="267" fill="#39ff88" font-weight="700">L3</text>
<text x="113.0" y="267" fill="#eafff3" font-weight="700" letter-spacing="2">DATA</text>
<text x="223.0" y="267" fill="#c9d6cf" style="font-size:13px">Postgres RLS on every table, public views hold no secrets</text>
<text x="833.0" y="267" text-anchor="end" fill="#39ff88" style="font-size:12px" class="st">■ ARMED</text>
