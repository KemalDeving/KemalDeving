<text x="450" y="25" text-anchor="middle" fill="#5b6b62" style="font-size:13px">kemal@kagu: ~ (ssh · tls1.3 · ed25519)</text>
<g class="ln" style="animation-delay:0.95s"><text x="28" y="78"><tspan fill="#39ff88">kemal@kagu</tspan><tspan fill="#5b6b62">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#5b6b62">$ </tspan><tspan fill="#eafff3">whoami</tspan></text></g><g class="ln" style="animation-delay:1.17s"><text x="28" y="105" fill="#c9d6cf">kemal can bayramoğlu  ::  co-founder &amp; security lead @ kagu software</text></g><g class="ln" style="animation-delay:1.94s"><text x="28" y="142"><tspan fill="#39ff88">kemal@kagu</tspan><tspan fill="#5b6b62">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#5b6b62">$ </tspan><tspan fill="#eafff3">cat /etc/kagu/role.conf</tspan></text></g><g class="ln" style="animation-delay:2.16s"><text x="28" y="169" fill="#c9d6cf">scope        = "every kagu product, end to end"</text></g><g class="ln" style="animation-delay:2.38s"><text x="28" y="196" fill="#c9d6cf">owns         = [auth, access control, data, infra, incident response]</text></g><g class="ln" style="animation-delay:2.60s"><text x="28" y="223" fill="#c9d6cf">also_ships   = [backend, apis, postgres schemas]</text></g><g class="ln" style="animation-delay:3.37s"><text x="28" y="260"><tspan fill="#39ff88">kemal@kagu</tspan><tspan fill="#5b6b62">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#5b6b62">$ </tspan><tspan fill="#eafff3">sudo audit --org kagusoftware --pinned</tspan></text></g><g class="ln" style="animation-delay:3.59s"><text x="28" y="287" fill="#39ff88">[ OK ]  TouchPadel ....... idempotent payments, db safety checks</text></g><g class="ln" style="animation-delay:3.81s"><text x="28" y="314" fill="#39ff88">[ OK ]  TurkCure ......... role-gated costs, enforced server-side</text></g><g class="ln" style="animation-delay:4.03s"><text x="28" y="341" fill="#39ff88">[ OK ]  UpperDeck ........ row level security, admin / owner roles</text></g><g class="ln" style="animation-delay:4.25s"><text x="28" y="368" fill="#39ff88">[ OK ]  KaguOs ........... internal ops, locked to the team</text></g><g class="ln" style="animation-delay:4.47s"><text x="28" y="395" fill="#ffcc4d">[ .. ]  next target ...... your product?</text></g><g class="ln" style="animation-delay:5.24s"><text x="28" y="432"><tspan fill="#39ff88">kemal@kagu</tspan><tspan fill="#5b6b62">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#5b6b62">$ </tspan><tspan fill="#eafff3">echo $MOTTO</tspan></text></g><g class="ln" style="animation-delay:5.46s"><text x="28" y="459" fill="#ff2e88">"trust nothing. verify everything. ship anyway."</text></g><g class="ln" style="animation-delay:5.98s"><text x="28" y="488"><tspan fill="#39ff88">kemal@kagu</tspan><tspan fill="#5b6b62">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#5b6b62">$ </tspan><tspan class="cur" fill="#39ff88">█</tspan></text></g>
