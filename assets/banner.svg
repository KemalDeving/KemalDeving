.scan{animation:scan 5s linear infinite}
@keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(360px)}}
.ring{transform-origin:170px 160px;animation:spin 24s linear infinite}
.ring2{transform-origin:170px 160px;animation:spin 16s linear infinite reverse}
