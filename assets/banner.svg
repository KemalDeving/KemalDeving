.name{font-size:46px;font-weight:800;fill:#eafff3;letter-spacing:1px}
.g1{fill:#22d3ee;opacity:.8;animation:gl1 3.8s infinite steps(1)}
.g2{fill:#ff2e88;opacity:.8;animation:gl2 3.8s infinite steps(1)}
@keyframes gl1{0%,86%,100%{transform:translate(0,0);opacity:0}88%{transform:translate(-4px,1px);opacity:.85}91%{transform:translate(3px,-2px);opacity:.85}94%{transform:translate(-2px,0);opacity:.85}}
